[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wound-forecasting"
version = "0.1.0"
description = "Reproducible evaluation utilities for longitudinal wound-image forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "torch>=2.1",
    "torchmetrics[image]>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
viz = ["matplotlib>=3.7", "torchvision>=0.16"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
