[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wound-forecasting"
version = "0.2.0"
description = "Training and evaluation for longitudinal wound-image forecasting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "PyYAML>=6.0",
    "torch>=2.1",
    "torchmetrics[image]>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
viz = ["matplotlib>=3.7", "torchvision>=0.16"]
artifacts = ["huggingface-hub>=0.24"]
dyneode = ["lpips>=0.1.4", "torchdiffeq>=0.2.4", "torchvision>=0.16"]
llama = ["huggingface-hub>=0.24", "pillow>=10", "torchvision>=0.16"]
river = ["albumentations>=1.4", "einops>=0.7", "h5py>=3.10", "torchdiffeq>=0.2.4", "torchvision>=0.16"]
all = [
    "albumentations>=1.4",
    "einops>=0.7",
    "h5py>=3.10",
    "huggingface-hub>=0.24",
    "lpips>=0.1.4",
    "pillow>=10",
    "torchdiffeq>=0.2.4",
    "torchvision>=0.16",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
